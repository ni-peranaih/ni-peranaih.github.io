<style>
  :root{
    --bg: #16261d;
    --bg-soft: #1c3226;
    --ink: #f2ede1;
    --ink-dim: #b9c4ba;
    --accent: #c4a06a;
    --rule: rgba(242,237,225,0.14);
    --fs: 0.88; /* 手机：字体缩放比例 */
  }

  /* 平板 */
  @media (min-width: 768px){
    :root{ --fs: 1.15; }
  }

  /* 电脑 */
  @media (min-width: 1100px){
    :root{ --fs: 1.3; }
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: #12331f; /* 静态兜底色，避免动画层加载前闪白 */
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 独立的背景动画层：position:fixed 脱离文档流，
     filter/background-position 动画只重绘这一层，不会牵连页面文字和链接，明显更流畅 */
  .bg-layer{
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      120deg,
      #12331f 0%,
      #164b3a 20%,
      #164a52 40%,
      #16354f 60%,
      #241d4a 80%,
      #12331f 100%
    );
    background-size: 260% 260%;
    animation:
      driftGradient 16s ease-in-out infinite,
      hueSwing 5s linear infinite;
    will-change: background-position, filter;
  }

  @keyframes driftGradient{
    0%   { background-position: 0% 0%; }
    50%  { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  @keyframes hueSwing{
    0%   { filter: hue-rotate(0deg) saturate(1.15); }
    100% { filter: hue-rotate(360deg) saturate(1.15); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-layer{ animation: none; }
  }

  .page{
    max-width: 500px;
    margin: 0 auto;
    padding: 72px 28px 56px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* 平板、电脑上字体变大，容器同步放宽 */
  @media (min-width: 768px){
    .page{ max-width: 600px; }
  }
  @media (min-width: 1100px){
    .page{ max-width: 680px; }
  }

  .avatar{
    position: relative;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(155deg, var(--bg-soft), var(--bg));
    border: 1px solid var(--rule);
    font-family: Georgia, "Songti SC", serif;
    font-size: calc(30px * var(--fs));
    color: var(--accent);
    letter-spacing: 1px;
    animation: breathe 3s ease-in-out infinite;
    will-change: transform;
  }

  /* 发光效果单独放在伪元素上，只用 opacity 过渡（走合成层，不触发重绘），
     不再逐帧动画 box-shadow 的模糊半径 */
  .avatar::after{
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    box-shadow: 0 0 26px 8px rgba(196,160,106,0.35);
    opacity: 0;
    animation: glow 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe{
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.12) rotate(2deg); }
  }

  @keyframes glow{
    0%, 100% { opacity: 0; }
    50%      { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .avatar, .avatar::after{ animation: none; }
  }

  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  h1{
    font-family: Georgia, "Songti SC", serif;
    font-weight: 500;
    font-size: calc(31px * var(--fs));
    text-align: center;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }

  .tagline{
    text-align:center;
    color: var(--ink-dim);
    font-size: calc(16.5px * var(--fs));
    line-height:1.6;
    margin: 0 0 36px;
  }

  .divider{
    width: 34px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 36px;
    opacity: 0.7;
  }

  .links{
    display:flex;
    flex-direction:column;
  }

  .link-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    padding: 17px 4px;
    border-bottom: 1px solid var(--rule);
    text-decoration:none;
    color: var(--ink);
    transition: padding-left 0.2s ease, color 0.2s ease;
  }

  .link-row:first-child{ border-top: 1px solid var(--rule); }

  .link-row:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 4px;
    color: var(--accent);
  }

  .link-row:hover{
    padding-left: 10px;
    color: var(--accent);
  }

  .link-main{
    display:flex;
    flex-direction:column;
    gap: 3px;
  }

  .link-label{
    font-size: calc(19px * var(--fs));
  }

  .link-desc{
    font-size: calc(14.5px * var(--fs));
    color: var(--ink-dim);
    white-space: pre-line;
  }

  .link-arrow{
    font-size: calc(19px * var(--fs));
    color: var(--ink-dim);
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .link-row:hover .link-arrow{
    transform: translateX(3px);
    color: var(--accent);
  }

  .link-row.multi:hover{ padding-left: 4px; color: var(--ink); }

  .link-btns{
    display:flex;
    flex-direction:column;
    gap: 8px;
    align-items:stretch;
  }

  .link-btn{
    font-size: calc(14px * var(--fs));
    padding: 6px 12px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--ink);
    text-decoration:none;
    text-align:center;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .link-btn:hover,
  .link-btn:focus-visible{
    color: var(--accent);
    border-color: var(--accent);
    outline: none;
  }

  footer{
    text-align:center;
    margin-top: 48px;
    font-size: calc(13.5px * var(--fs));
    letter-spacing: 0.5px;
    color: var(--ink-dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  #clock{
    margin-left: 10px;
    color: var(--accent);
  }
</style>

  if (profile.avatarImage) {
    const img = document.createElement('img');
    img.src = profile.avatarImage;
    img.alt = '头像';

  } else {

  }
  document.getElementById('siteName').textContent = profile.name;
  document.getElementById('tagline').textContent = profile.tagline;

  const clockFmt = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Shanghai',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  });
  function updateClock(){
    // sv-SE 输出格式为 "2026-10-19 14:30:05"
    document.getElementById('clock').textContent = clockFmt.format(new Date()) + ' (UTC+8)';
  }
  function scheduleClockTick(){
    updateClock();
    // 对齐到下一个整秒再触发，避免 setInterval 长期运行后的漂移
    const delay = 1000 - (Date.now() % 1000);
    setTimeout(scheduleClockTick, delay);
  }
  scheduleClockTick();

  const list = document.getElementById('linkList');
  list.innerHTML = ''; // 清空HTML中预先写好的链接,防止重复生成
  links.forEach(item => {
    if (item.buttons) {
      const row = document.createElement('div');
      row.className = 'link-row multi';
      const m = document.createElement('span');
      m.className = 'link-main';
      const l = document.createElement('span');
      l.className = 'link-label';

      const d = document.createElement('span');
      d.className = 'link-desc';
      d.textContent = item.desc;
      m.append(l, d);
      const btns = document.createElement('span');
      btns.className = 'link-btns';
      item.buttons.forEach(b => {
        const x = document.createElement('a');
        x.className = 'link-btn';
        x.href = b.url;
        x.target = '_blank';
        x.rel = 'noopener noreferrer';
        x.textContent = b.text;
        btns.appendChild(x);
      });
      row.append(m, btns);
      list.appendChild(row);
      return;

    a.target = '_blank';

    const label = document.createElement('span');

    const arrow = document.createElement('span');
    arrow.className = 'link-arrow';
    arrow.textContent = '→';
    a.append(main, arrow);
    list.appendChild(a);
  });
