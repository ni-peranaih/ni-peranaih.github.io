<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藏寶閣</title>
<meta name="description" content="海外賬號/科學上網/Free ESIM">
<meta name="theme-color" content="#12331f">
<link rel="icon" id="favicon" href="data:,">
<style>
  :root{
    --bg: #16261d;
    --bg-soft: #1c3226;
    --ink: #f2ede1;
    --ink-dim: #b9c4ba;
    --accent: #c4a06a;
    --rule: rgba(242,237,225,0.14);
    --fs: 0.88; /* 手机：字体缩放比例 */
  }

  /* 平板 */
  @media (min-width: 768px){
    :root{ --fs: 1.15; }
  }

  /* 电脑 */
  @media (min-width: 1100px){
    :root{ --fs: 1.3; }
  }

  *{ box-sizing:border-box; }

  /* 静态兜底色只放在 html 上（body 不设背景，否则会盖住 z-index:-1 的动画层） */
  html{ background: #12331f; }
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
  }

  /* 独立的背景动画层：position:fixed 脱离文档流，
     filter/background-position 动画只重绘这一层，不会牵连页面文字和链接，明显更流畅 */
  .bg-layer{
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      120deg,
      #12331f 0%,
      #164b3a 20%,
      #164a52 40%,
      #16354f 60%,
      #241d4a 80%,
      #12331f 100%
    );
    background-size: 260% 260%;
    animation:
      driftGradient 16s ease-in-out infinite,
      hueSwing 5s linear infinite;
    will-change: background-position, filter;
  }

  @keyframes driftGradient{
    0%   { background-position: 0% 0%; }
    50%  { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  @keyframes hueSwing{
    0%   { filter: hue-rotate(0deg) saturate(1.15); }
    100% { filter: hue-rotate(360deg) saturate(1.15); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-layer{ animation: none; }
  }

  .page{
    max-width: 500px;
    margin: 0 auto;
    padding: 72px 28px 56px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* 平板、电脑上字体变大，容器同步放宽 */
  @media (min-width: 768px){
    .page{ max-width: 600px; }
  }
  @media (min-width: 1100px){
    .page{ max-width: 680px; }
  }

  .avatar{
    position: relative;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(155deg, var(--bg-soft), var(--bg));
    border: 1px solid var(--rule);
    font-family: Georgia, "Songti SC", serif;
    font-size: calc(30px * var(--fs));
    color: var(--accent);
    letter-spacing: 1px;
    animation: breathe 3s ease-in-out infinite;
    will-change: transform;
  }

  /* 发光效果单独放在伪元素上，只用 opacity 过渡（走合成层，不触发重绘），
     不再逐帧动画 box-shadow 的模糊半径 */
  .avatar::after{
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    box-shadow: 0 0 26px 8px rgba(196,160,106,0.35);
    opacity: 0;
    animation: glow 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe{
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.12) rotate(2deg); }
  }

  @keyframes glow{
    0%, 100% { opacity: 0; }
    50%      { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .avatar, .avatar::after{ animation: none; }
  }

  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  h1{
    font-family: Georgia, "Songti SC", serif;
    font-weight: 500;
    font-size: calc(31px * var(--fs));
    text-align: center;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }

  .tagline{
    text-align:center;
    color: var(--ink-dim);
    font-size: calc(16.5px * var(--fs));
    line-height:1.6;
    margin: 0 0 36px;
  }

  .divider{
    width: 34px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 36px;
    opacity: 0.7;
  }

  .links{
    display:flex;
    flex-direction:column;
  }

  .link-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    padding: 17px 4px;
    border-bottom: 1px solid var(--rule);
    text-decoration:none;
    color: var(--ink);
    transition: padding-left 0.2s ease, color 0.2s ease;
  }

  .link-row:first-child{ border-top: 1px solid var(--rule); }

  .link-row:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 4px;
    color: var(--accent);
  }

  .link-row:hover{
    padding-left: 10px;
    color: var(--accent);
  }

  .link-main{
    display:flex;
    flex-direction:column;
    gap: 3px;
  }

  .link-label{
    font-size: calc(19px * var(--fs));
  }

  .link-desc{
    font-size: calc(14.5px * var(--fs));
    color: var(--ink-dim);
    white-space: pre-line;
  }


  .link-desc a{
    display: block;
    color: inherit;
    text-decoration: none;
  }
  .link-desc a:hover{ text-decoration: underline; }

  .link-arrow{
    font-size: calc(19px * var(--fs));
    color: var(--ink-dim);
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .link-row:hover .link-arrow{
    transform: translateX(3px);
    color: var(--accent);
  }

  .link-row.multi:hover{ padding-left: 4px; color: var(--ink); }

  .link-btns{
    display:flex;
    flex-direction:column;
    gap: 8px;
    align-items:stretch;
  }

  .link-btn{
    font-size: calc(14px * var(--fs));
    padding: 6px 12px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--ink);
    text-decoration:none;
    text-align:center;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .link-btn:hover,
  .link-btn:focus-visible{
    color: var(--accent);
    border-color: var(--accent);
    outline: none;
  }

  footer{
    text-align:center;
    margin-top: 48px;
    font-size: calc(13.5px * var(--fs));
    letter-spacing: 0.5px;
    color: var(--ink-dim);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  #clock{
    margin-left: 10px;
    color: var(--accent);
  }
  /* —— 留言板 / 在線客服 / 訪問量 —— */
  #views{ margin-left:10px; color:var(--ink-dim); }
  .board{ margin-top:28px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .board summary{ display:flex; justify-content:space-between; padding:17px 4px; cursor:pointer; list-style:none; font-size:calc(19px * var(--fs)); }
  .board summary::-webkit-details-marker{ display:none; }
  .board summary::after{ content:"+"; color:var(--ink-dim); }
  .board[open] summary::after{ content:"−"; }
  .msg, .msg-empty{ padding:10px 4px; border-top:1px solid var(--rule); font-size:calc(14.5px * var(--fs)); line-height:1.6; word-break:break-word; }
  .msg b{ margin-right:8px; font-weight:500; color:var(--accent); }
  .msg-empty{ color:var(--ink-dim); }
  .form{ display:flex; flex-direction:column; gap:8px; padding:12px 4px 18px; }
  .form input, .form textarea, .chat-in input{ width:100%; padding:9px 12px; font:inherit; font-size:16px; color:var(--ink); background:rgba(0,0,0,0.22); border:1px solid var(--rule); border-radius:10px; outline:none; }
  .form input:focus, .form textarea:focus, .chat-in input:focus{ border-color:var(--accent); }
  .form textarea{ min-height:76px; resize:vertical; }
  .btn{ align-self:flex-end; padding:8px 16px; font:inherit; font-size:calc(14px * var(--fs)); color:var(--accent); background:transparent; border:1px solid var(--accent); border-radius:999px; cursor:pointer; }
  .btn:disabled{ opacity:0.5; }
  .tip{ min-height:1.2em; font-size:calc(13px * var(--fs)); color:var(--ink-dim); }
  .chat-fab{ position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:5; width:54px; height:54px; font-size:22px; color:var(--accent); background:var(--bg); border:1px solid var(--accent); border-radius:50%; box-shadow:0 4px 18px rgba(0,0,0,0.35); cursor:pointer; }
  .chat{ position:fixed; right:14px; bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:5; display:none; flex-direction:column; width:min(340px, calc(100vw - 28px)); height:min(440px, calc(100vh - 130px)); height:min(440px, calc(100dvh - 130px)); height:min(440px, calc(100dvh - 130px)); overflow:hidden; background:var(--bg); border:1px solid var(--rule); border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.45); }
  .chat.on{ display:flex; }
  .chat-hd{ padding:12px 14px; font-size:15px; color:var(--accent); border-bottom:1px solid var(--rule); }
  .chat-hd small{ display:block; margin-top:2px; font-size:12px; color:var(--ink-dim); }
  .chat-hd small.on{ color:var(--accent); }
  .chat-log{ flex:1; display:flex; flex-direction:column; gap:8px; padding:12px; overflow-y:auto; }
  .bub{ align-self:flex-start; max-width:82%; padding:8px 12px; font-size:14px; line-height:1.5; word-break:break-word; background:var(--bg-soft); border-radius:12px; }
  .bub.me{ align-self:flex-end; background:rgba(196,160,106,0.22); }
  .chat-in{ display:flex; gap:8px; padding:10px; border-top:1px solid var(--rule); }
  .chat-in .btn{ align-self:auto; }
  .notice{ margin:0 0 28px; padding:10px 14px; font-size:calc(14px * var(--fs)); line-height:1.6; word-break:break-word; background:rgba(196,160,106,0.1); border-left:2px solid var(--accent); }
  .notice[hidden]{ display:none; }
  .msg-re{ margin-top:4px; padding-left:10px; color:var(--ink-dim); border-left:2px solid var(--accent); }
  .form .cap{ display:flex; align-items:center; gap:8px; font-size:15px; color:var(--ink-dim); }
  .form .cap input{ width:84px; }
  .chat-fab.dot::after{ content:""; position:absolute; top:3px; right:3px; width:12px; height:12px; background:#e5534b; border:2px solid var(--bg); border-radius:50%; }
  .form .cap[hidden], .chat-ct[hidden]{ display:none; }
  .chat-ct{ display:flex; gap:8px; padding:8px 10px 0; border-top:1px solid var(--rule); }
  .chat-ct input{ flex:1; min-width:0; padding:7px 10px; font:inherit; font-size:16px; color:var(--ink); background:rgba(0,0,0,0.22); border:1px solid var(--rule); border-radius:10px; outline:none; }
  .chat-ct .btn{ align-self:auto; }
  .chat-ct .btn, .chat-in .btn{ flex:none; white-space:nowrap; }
  .bub .st{ display:block; margin-top:2px; font-size:11px; text-align:right; color:var(--ink-dim); }
  .lang-sw{ position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); right:12px; z-index:5; display:flex; overflow:hidden; border:1px solid var(--rule); border-radius:999px; }
  .lang-sw button{ padding:4px 10px; font:inherit; font-size:13px; color:var(--ink-dim); background:transparent; border:0; cursor:pointer; }
  .lang-sw button + button{ border-left:1px solid var(--rule); }
  .lang-sw button.on{ color:var(--accent); background:rgba(196,160,106,0.14); }
  .ct-wrap{ position:relative; flex:1; min-width:0; }
  .ct-wrap input{ width:100%; box-sizing:border-box; }
  .ct-hint{ position:absolute; top:1px; bottom:1px; left:11px; right:11px; display:flex; align-items:center; overflow:hidden; pointer-events:none; }
  .ct-hint span{ display:flex; flex:none; animation:ctMq var(--t,10s) linear infinite; }
  .ct-hint b{ flex:none; padding-right:3em; font-size:15px; font-weight:normal; white-space:nowrap; color:var(--ink-dim); opacity:0.8; }
  .ct-hint.fit b + b{ display:none; }   /* 放得下就不滾動，也不要第二份 */
  .ct-hint.fit span{ animation:none; }
  .ct-wrap input:focus ~ .ct-hint, .ct-wrap input:not(:placeholder-shown) ~ .ct-hint{ display:none; }
  /* 連續向左滾動；第二份文字接在後面，形成無縫循環 */
  @keyframes ctMq{ to{ transform:translateX(calc(-1 * var(--w,0px))); } }
  @media (prefers-reduced-motion: reduce){ .ct-hint span{ animation:none; } .ct-hint b + b{ display:none; } }
</style>
</head>
<body>

  <div class="bg-layer"></div>

  <div class="page">
    <div class="avatar" id="avatar"></div>
    <h1 id="siteName">藏寶閣</h1>
    <p class="tagline" id="tagline">千帆過盡皆是客 洗盡鉛華誰人知</p>
    <div class="divider"></div>
    <div class="notice" id="notice" hidden></div>

    <nav class="links" id="linkList">
      <a class="link-row" href="https://177444.xyz" target="_blank" rel="noopener noreferrer">
        <span class="link-main">
          <span class="link-label">海外賬號</span>
          <span class="link-desc">Telegram丨推特丨谷歌丨Facebook丨蘋果</span>
        </span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-row" href="https://QIOAUO.快车.com" target="_blank" rel="noopener noreferrer">
        <span class="link-main">
          <span class="link-label">科學上網</span>
          <span class="link-desc">穩定 · 安全 · 高速</span>
        </span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-row" href="https://www.eskimo.travel/ZS26633" target="_blank" rel="noopener noreferrer">
        <span class="link-main">
          <span class="link-label">ESIM</span>
          <span class="link-desc">Free 500M</span>
        </span>
        <span class="link-arrow">→</span>
      </a>
      <div class="link-row multi">
        <span class="link-main">
          <span class="link-label">客服支援</span>
          <span class="link-desc"><a href="https://t.me/qqusbot" target="_blank" rel="noopener noreferrer">電報: @qqusbot</a></span>
        </span>
        <span class="link-btns">
          <a class="link-btn" href="https://t.me/qqusbot" target="_blank" rel="noopener noreferrer">電報</a>
        </span>
      </div>
    </nav>

    <details class="board" id="board">
      <summary>留言板</summary>
      <div id="msgList"></div>
      <div class="form">
        <input id="mName" maxlength="20" placeholder="暱稱（選填）" autocomplete="nickname">
        <textarea id="mText" maxlength="300" placeholder="寫下你的留言，審核通過後顯示"></textarea>
        <div id="mTs"></div>
        <div class="cap" id="mCap" hidden><span id="mQ"></span><input id="mA" inputmode="numeric" maxlength="3" placeholder="答案" autocomplete="off"></div>
        <span class="tip" id="mTip"></span>
        <button class="btn" id="mSend" type="button">提交留言</button>
      </div>
    </details>

    <footer>
      <span id="footerText"></span>
      <span id="clock"></span><span id="views"></span>
    </footer>
  </div>

<script>
  // ────────────────────────────────────────────────
  // 在这里修改你的信息和链接，改完保存刷新即可生效
  // ────────────────────────────────────────────────

  const profile = {
    initial: "號",              // 没填图片时，头像里显示的字
    avatarImage: "/avatar.jpg",
    name: "藏寶閣",
    tagline: "千帆過盡皆是客 洗盡鉛華誰人知",
    footerText: "花開富貴"
  };

  const links = [
    { label: "海外賬號",     desc: "Telegram丨推特丨谷歌丨Facebook丨蘋果",   url: "https://177444.xyz" },
    { label: "科學上網",  desc: "穩定 · 安全 · 高速",    url: "https://QIOAUO.快车.com" },
    { label: "ESIM",  desc: "Free 500M",  url: "https://www.eskimo.travel/ZS26633" },
    { label: "客服支援",     lines: [
        { text: "電報: @qqusbot", url: "https://t.me/qqusbot" }
      ],
      buttons: [
        { text: "電報", url: "https://t.me/qqusbot" }
      ] }
  ];

  // ────────────────────────────────────────────────
  // 下面是渲染逻辑，一般不需要改动
  // ────────────────────────────────────────────────

  if (profile.avatarImage) {
    const img = document.createElement('img');
    img.src = profile.avatarImage;
    img.alt = '頭像';
    document.getElementById('avatar').appendChild(img);
    document.getElementById('favicon').href = profile.avatarImage;
  } else {
    document.getElementById('avatar').textContent = profile.initial;
  }
  document.getElementById('siteName').textContent = profile.name;
  document.getElementById('tagline').textContent = profile.tagline;
  document.getElementById('footerText').textContent = profile.footerText;

  const clockFmt = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Shanghai',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hourCycle: 'h23'
  });
  function updateClock(){
    // sv-SE 输出格式为 "2026-10-19 14:30:05"
    document.getElementById('clock').textContent = clockFmt.format(new Date());
  }
  function scheduleClockTick(){
    updateClock();
    // 对齐到下一个整秒再触发，避免 setInterval 长期运行后的漂移
    const delay = 1000 - (Date.now() % 1000);
    setTimeout(scheduleClockTick, delay);
  }
  scheduleClockTick();

  const list = document.getElementById('linkList');
  const render = items => {
  list.innerHTML = ''; // 清空旧链接，防止重复生成
  items.forEach(item => {
    if (item.buttons) {
      const row = document.createElement('div');
      row.className = 'link-row multi';
      row.dataset.id = item.label;
      const m = document.createElement('span');
      m.className = 'link-main';
      const l = document.createElement('span');
      l.className = 'link-label';
      l.textContent = item.label;
      const d = document.createElement('span');
      d.className = 'link-desc';
      if (item.lines) {
        item.lines.forEach(ln => {
          const x = document.createElement('a');
          x.href = ln.url;
          if (!ln.url.startsWith('mailto:')) { x.target = '_blank'; x.rel = 'noopener noreferrer'; }
          x.textContent = ln.text;
          d.appendChild(x);
        });
      } else {
        d.textContent = item.desc;
      }
      m.append(l, d);
      const btns = document.createElement('span');
      btns.className = 'link-btns';
      item.buttons.forEach(b => {
        const x = document.createElement('a');
        x.className = 'link-btn';
        x.dataset.k = b.text;
        x.href = b.url;
        if (!b.url.startsWith('mailto:')) { x.target = '_blank'; x.rel = 'noopener noreferrer'; }
        x.textContent = b.text;
        btns.appendChild(x);
      });
      row.append(m, btns);
      list.appendChild(row);
      return;
    }
    const a = document.createElement('a');
    a.className = 'link-row';
    a.dataset.id = item.label;
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    const main = document.createElement('span');
    main.className = 'link-main';
    const label = document.createElement('span');
    label.className = 'link-label';
    label.textContent = item.label;
    const desc = document.createElement('span');
    desc.className = 'link-desc';
    desc.textContent = item.desc;
    main.append(label, desc);
    const arrow = document.createElement('span');
    arrow.className = 'link-arrow';
    arrow.textContent = '→';
    a.append(main, arrow);
    list.appendChild(a);
  });
  };
  render(links);
  // 链接由机器人的 /链接 命令管理；取不到或为空时保留上面的内置链接
  fetch('/api/links').then(r => r.json()).then(rows => {
    const ok = Array.isArray(rows) ? rows.filter(x => /^https?:\/\//i.test(x.url)) : [];
    if (ok.length) render(ok);
  }).catch(() => {});
</script>

  <div class="chat-log" id="chatLog"></div>
  <div class="chat-ct" id="chatCt" hidden><div class="ct-wrap"><input id="ctTxt" maxlength="40" placeholder=" " aria-label="留下電報用戶名或聯繫方式"><div class="ct-hint" id="ctHint"><span><b>留下電報用戶名或聯繫方式，客服離線中，上線後會主動聯繫你</b><b aria-hidden="true">留下電報用戶名或聯繫方式，客服離線中，上線後會主動聯繫你</b></span></div></div><button class="btn" id="ctSend" type="button">提交</button></div>
  <div class="chat-in"><input id="chatTxt" maxlength="500" placeholder="輸入消息"><button class="btn" id="chatSend" type="button">發送</button></div>
</div>

<script>
(() => {
  const API = 'https://cangbaoge.3834864380.workers.dev/api'; // 接口地址：同域名 /api；若接口在別的域名，改成完整地址
  const $ = id => document.getElementById(id);
  const el = (cls, text, tag = 'div') => Object.assign(document.createElement(tag), { className: cls, textContent: text });
  const get = path => fetch(API + path).then(r => r.json());
  const post = (path, data) => fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json());
  const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };
  const open = () => $('chat').classList.contains('on');
  const rnd = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, '').slice(0, 32);
  let vid = store.get('vid'); if (!vid) { vid = rnd(); store.set('vid', vid); }

  // 訪問量 + 公告 + 來源：同一次瀏覽只計一次
  let counted = false; try { counted = sessionStorage.getItem('hit') === '1'; } catch {}
  let ref = ''; try { const h = new URL(document.referrer).hostname; if (h !== location.hostname) ref = h; } catch {}
  get('/hit?vid=' + vid + '&ref=' + encodeURIComponent(ref) + (counted ? '&c=0' : '')).then(r => {
    $('views').textContent = '訪問 ' + r.n;
    if (r.notice) { $('notice').textContent = r.notice; $('notice').hidden = false; }
    try { sessionStorage.setItem('hit', '1'); } catch {}
  }).catch(() => {});

  // 鏈接點擊統計（用原文名稱，切換簡體也不會拆開統計）
  document.addEventListener('click', e => {
    const a = e.target.closest('a'), row = a && a.closest('.link-row');
    if (!row || !row.dataset.id || !navigator.sendBeacon) return;
    navigator.sendBeacon(API + '/click?id=' + encodeURIComponent(row.dataset.id + (a.dataset.k ? '·' + a.dataset.k : '')));
  });

  // 人機驗證：服務器配置了 Turnstile 就用它，否則用算術題
  let site = '';
  const tsRender = async (box, cb) => {
    if (!window.turnstile) await new Promise(res => { const s = el('', '', 'script'); s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; s.onload = s.onerror = res; document.head.append(s); });
    return window.turnstile ? turnstile.render(box, { sitekey: site, theme: 'dark', callback: cb }) : null;
  };

  // 留言板（驗證、置頂、回覆）
  let loaded = false, tok = '', tsTok = '', wid = null;
  const loadQ = async () => {
    try {
      const r = await get('/q');
      if (r.site) { site = r.site; $('mCap').hidden = true; tsTok = ''; if (wid === null) { wid = await tsRender($('mTs'), t => { tsTok = t; }); if (wid === null) $('mTip').textContent = '驗證組件加載失敗，請檢查網絡或關閉攔截插件後重試'; } else turnstile.reset(wid); }
      else { tok = r.tok; $('mCap').hidden = true; } // 验证已关闭（2026-10-27）：不显示算术题
    } catch {}
  };
  $('board').addEventListener('toggle', async () => {
    if (!$('board').open || loaded) return;
    loaded = true; loadQ();
    try {
      const rows = await get('/msgs');
      $('msgList').replaceChildren(...(rows.length ? rows.map(m => {
        const d = el('msg'); d.append(el('', (m.pin ? '📌 ' : '') + m.name, 'b'), m.text);
        if (m.reply) d.append(el('msg-re', '↳ ' + m.reply));
        return d;
      }) : [el('msg-empty', '還沒有留言，來寫第一條吧')]));
    } catch { loaded = false; $('msgList').replaceChildren(el('msg-empty', '加載失敗，請稍後再試')); }
  });
  $('mSend').onclick = async () => {
    const text = $('mText').value.trim(); if (!text) return;
    if (site && !tsTok) { $('mTip').textContent = '請先完成上方的驗證'; return; }
    $('mSend').disabled = true;
    try {
      const r = await post('/msg', { name: $('mName').value, text, tok, ans: $('mA').value, ts: tsTok });
      $('mTip').textContent = r.ok ? '已提交，審核通過後顯示' : r.err === 'cap' ? '驗證沒通過，請重試' : r.err === 'rate' ? '提交太頻繁，請稍後再試' : '提交失敗，請重試';
      if (r.ok) $('mText').value = '';
      loadQ();
    } catch { $('mTip').textContent = '網絡錯誤，請重試'; }
    $('mSend').disabled = false;
  };

  // 事件統計（打開客服窗口、頁面語言）：每次瀏覽每種事件只發一次，服務器再按訪客每天去重
  const ev = e => { try { if (sessionStorage.getItem('ev_' + e)) return; sessionStorage.setItem('ev_' + e, '1'); } catch {} navigator.sendBeacon && navigator.sendBeacon(API + '/ev?e=' + e + '&vid=' + vid); };

  // 在線客服：打開面板每 2 秒拉一次；聊過天的訪客關閉面板後每 20 秒檢查一次
  let sid = store.get('sid'); if (!sid) { sid = rnd(); store.set('sid', sid); }
  const log = $('chatLog'), title = document.title; let last = 0, seen = +store.get('seen') || 0, timer, lastV = null, flash = null, lastBad = false, lastAct = Date.now();
  const beep = () => { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.05; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.15); } catch {} };
  const flashTitle = () => { if (flash) return; let on = false; flash = setInterval(() => { document.title = (on = !on) ? (conv ? conv('💬 新回覆') : '💬 新回覆') : baseTitle(); }, 1000); };
  const stopFlash = () => { clearInterval(flash); flash = null; document.title = baseTitle(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && open()) stopFlash(); });
  const poll = async () => {
    try {
      const r = await get('/chat?sid=' + sid + '&after=' + last + (lastBad ? '&chk=1' : ''));
      if (lastBad && r.vd === 1 && lastV) { lastV.textContent = '已送達'; lastBad = false; } // 之前推送失败的消息后来补发成功了
      $('chatSt').className = r.on ? 'on' : '';
      $('chatSt').textContent = r.on ? '● 客服在線，通常幾分鐘內回覆' : r.off ? '現在不在營業時間（' + r.hours.replace('-', ':00–') + ':00），留言後上線會回覆' : '客服暫時離線，留言後會盡快回覆，急事請用電報 @qqusbot';
      $('chatCt').hidden = !(!r.on && store.get('chatted') && !store.get('ct'));
      if (!$('chatCt').hidden) fit();
      r.msgs.forEach(m => {
        if (m.id <= last) return; // 已顯示過（並發輪詢返回了同一批消息）
        const b = el('bub' + (m.side === 'v' ? ' me' : ''), m.text);
        if (m.side === 'v') { if (lastV) lastV.remove(); lastV = el('st', m.d ? '已送達' : '未送達，請稍後再試或用電報聯繫', 'span'); b.append(lastV); lastBad = !m.d; }
        log.append(b);
        last = Math.max(last, m.id); lastAct = Date.now();
        if (m.side === 'a' && (document.hidden || !open()) && m.id > seen) { $('chatFab').classList.add('dot'); beep(); flashTitle(); }
      });
      if (open()) { seen = last; store.set('seen', last); log.scrollTop = log.scrollHeight; }
    } catch {}
  };
  const loop = () => {
    clearTimeout(timer);
    if (!open() && !store.get('chatted')) return;
    if (!document.hidden) poll();
    const idle = Date.now() - lastAct; // 有动静 2 秒一次；闲下来逐步放慢到 5 秒、10 秒
    timer = setTimeout(loop, open() ? (idle < 6e4 ? 2000 : idle < 3e5 ? 5000 : 10000) : 20000);
  };
  $('chatFab').onclick = () => {
    $('chat').classList.toggle('on'); $('chatFab').classList.remove('dot');
    if (open()) { lastAct = Date.now(); ev('open'); stopFlash(); seen = last; store.set('seen', last); if (!log.children.length) log.append(el('bub', '你好，有什麼可以幫你？')); loop(); }
  };
  // 第一次發言前要驗證：先暫存這條消息，驗證通過後自動（Turnstile）或在下一次輸入答案後（算術題）發出
  let held = null, ctok = '';
  const ask = async () => {
    try {
      const q = await get('/q');
      if (q.site) { site = q.site; const b = el('bub', '為防止騷擾，請先完成驗證：'), box = el(''); b.append(box); log.append(b); if (!(await tsRender(box, t => { b.remove(); deliver({ ts: t }); }))) b.textContent = '驗證組件加載失敗，請檢查網絡或關閉攔截插件後重試'; }
      else { ctok = q.tok; log.append(el('bub', '為防止騷擾，請先回答：' + q.q + ' = ?')); }
      log.scrollTop = log.scrollHeight;
    } catch {}
  };
  const deliver = async extra => {
    try {
      const r = await post('/chat/send', { sid, text: held, ...extra });
      if (r.ok) { held = null; ctok = ''; store.set('chatted', '1'); loop(); }
      else if (r.err === 'cap') { if (extra.ans !== undefined) log.append(el('bub', '答案不對，請重新計算')); ask(); }
      else { held = null; log.append(el('bub', r.err === 'rate' ? '發送太頻繁，請稍後再試' : '發送失敗，請重試')); }
    } catch { held = null; log.append(el('bub', '網絡錯誤，請重試')); }
  };
  const send = async () => {
    const t = $('chatTxt'), text = t.value.trim(); if (!text) return;
    t.value = ''; lastAct = Date.now();
    if (held && ctok) { log.append(el('bub me', text)); return deliver({ tok: ctok, ans: text }); }
    held = text; deliver({});
  };
  $('chatSend').onclick = send;
  $('chatTxt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) send(); });
  const fit = () => {
    const h = $('ctHint'), b = h && h.querySelector('b'); if (!b || !h.clientWidth) return;
    const w = b.getBoundingClientRect().width, tw = w - parseFloat(getComputedStyle(b).paddingRight);
    h.classList.toggle('fit', tw <= h.clientWidth);        // 放得下：不滾動
    h.firstElementChild.style.setProperty('--w', w + 'px');
    h.firstElementChild.style.setProperty('--t', Math.max(6, w / 40) + 's');   // 約每秒 40px
  };
  window.addEventListener('resize', fit);
  $('ctSend').onclick = async () => {
    const contact = $('ctTxt').value.trim(); if (!contact) return;
    try {
      const r = await post('/chat/contact', { sid, contact });
      if (r.ok) { store.set('ct', '1'); $('chatCt').hidden = true; log.append(el('bub', '已記下，上線後會主動聯繫你')); } else log.append(el('bub', '提交失敗，請重試'));
    } catch { log.append(el('bub', '網絡錯誤，請重試')); }
  };
  loop();

  // 語言切換：繁 / 简 / EN（偏好記在本機）。簡體用 OpenCC（點擊時才加載），英文用下面的內置對照表
  const EN = {
    '藏寶閣': 'Treasure Pavilion', '千帆過盡皆是客 洗盡鉛華誰人知': 'A thousand sails pass, all are guests; strip away the glamour — who will know?', '花開富貴': 'May Fortune Bloom',
    '海外賬號': 'Overseas Accounts', 'Telegram丨推特丨谷歌丨Facebook丨蘋果': 'Telegram | Twitter | Google | Facebook | Apple',
    '科學上網': 'Secure Internet Access', '穩定 · 安全 · 高速': 'Stable · Secure · Fast',
    '客服支援': 'Customer Support', '電報: @qqusbot': 'Telegram: @qqusbot', '電報': 'Telegram',
    '頭像': 'Avatar', '留言板': 'Guestbook', '提交留言': 'Post message', '暱稱（選填）': 'Nickname (optional)', '寫下你的留言，審核通過後顯示': 'Write your message — it appears after review', '答案': 'Answer',
    '還沒有留言，來寫第一條吧': 'No messages yet. Be the first to write one', '加載失敗，請稍後再試': 'Failed to load, please try again later',
    '請先完成上方的驗證': 'Please complete the verification above first', '驗證組件加載失敗，請檢查網絡或關閉攔截插件後重試': 'Verification failed to load. Check your network or disable blockers and retry', '已提交，審核通過後顯示': 'Submitted — it will appear after review',
    '驗證沒通過，請重試': 'Verification failed, please retry', '提交太頻繁，請稍後再試': 'Submitting too fast, please try again later', '提交失敗，請重試': 'Submit failed, please retry', '網絡錯誤，請重試': 'Network error, please retry',
    '在線客服': 'Live Support', '● 客服在線，通常幾分鐘內回覆': '● Support is online, usually replies within minutes',
    '客服暫時離線，留言後會盡快回覆，急事請用電報 @qqusbot': 'Support is offline. Leave a message and we will reply soon. For urgent matters, use Telegram @qqusbot',
    '留下電報用戶名或聯繫方式，客服離線中，上線後會主動聯繫你': 'Leave your Telegram username or contact. Support is offline and will reach out once back online',
    '留下電報用戶名或聯繫方式': 'Leave your Telegram username or contact',
    '提交': 'Submit', '發送': 'Send', '輸入消息': 'Type a message', '你好，有什麼可以幫你？': 'Hi, how can we help?',
    '為防止騷擾，請先完成驗證：': 'To prevent spam, please complete the verification:', '答案不對，請重新計算': 'Wrong answer, please try again',
    '發送太頻繁，請稍後再試': 'Sending too fast, please try again later', '發送失敗，請重試': 'Failed to send, please retry',
    '已記下，上線後會主動聯繫你': 'Noted. We will contact you once we are back online',
    '已送達': 'Delivered', '未送達，請稍後再試或用電報聯繫': 'Not delivered. Please try again later or contact us on Telegram',
    '💬 新回覆': '💬 New reply', '已收到，客服上線後會盡快回覆你。': 'Received. We will reply as soon as support is back online.', '現在不在營業時間，明早回覆你。': 'We are outside business hours and will reply tomorrow morning.'
  };
  const ENRE = [
    [/^訪問 (\d+)$/, m => 'Views ' + m[1]],
    [/^現在不在營業時間（(.+)），留言後上線會回覆$/, m => 'Outside business hours (Beijing time ' + m[1] + '). Leave a message and we will reply once online'],
    [/^為防止騷擾，請先回答：(.+)$/, m => 'To prevent spam, please answer: ' + m[1]]
  ];
  const enConv = s => {
    const t = s.trim(); if (!t) return s;
    let r = EN[t];
    if (r === undefined) for (const [re, f] of ENRE) { const m = re.exec(t); if (m) { r = f(m); break; } }
    return r === undefined ? s : s.replace(t, () => r);
  };
  const sw = [...document.querySelectorAll('#langSw button')];
  let mode = store.get('lang'); if (mode !== 'cn' && mode !== 'en') mode = 'tw';
  let conv = null, cc = null, obs = null;
  const baseTitle = () => conv ? conv(title) : title;
  const mark = () => sw.forEach(b => b.classList.toggle('on', b.dataset.l === mode));
  const ATTRS = ['placeholder', 'aria-label', 'alt', 'title'];
  const walk = root => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName) ? 2 : 1 }), ns = [];
    while (w.nextNode()) ns.push(w.currentNode);
    ns.forEach(n => { const v = conv(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; });
    const els = root.querySelectorAll ? [...root.querySelectorAll(ATTRS.map(a => '[' + a + ']').join(','))] : [];
    if (root.nodeType === 1) els.push(root);
    els.forEach(e => ATTRS.forEach(a => { if (e.hasAttribute(a)) { const v = conv(e.getAttribute(a)); if (v !== e.getAttribute(a)) e.setAttribute(a, v); } }));
    fit();
  };
  const loadCC = () => cc ? Promise.resolve() : new Promise(res => {
    const s = el('', '', 'script'); s.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/t2cn.js';
    s.onload = () => { try { cc = OpenCC.Converter({ from: 'hk', to: 'cn' }); } catch {} res(); }; s.onerror = res; document.head.append(s);
  });
  const start = fn => {
    conv = fn; walk(document.body); document.documentElement.lang = mode === 'en' ? 'en' : 'zh-Hans'; document.title = baseTitle();
    obs = new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) walk(n); else if (n.nodeType === 3) n.nodeValue = conv(n.nodeValue); })));
    obs.observe(document.body, { childList: true, subtree: true });
  };
  sw.forEach(b => b.onclick = async () => {
    const to = b.dataset.l; if (to === mode) return;
    // 頁面已被轉換過（簡體/英文）時，直接重新載入最乾淨
    if (mode !== 'tw' || to === 'tw') { store.set('lang', to); location.reload(); return; }
    if (to === 'cn') { await loadCC(); if (!cc) return; }
    mode = to; store.set('lang', to); mark(); start(to === 'cn' ? cc : enConv);
  });
  mark();
  ev('lang_' + mode);
  if (mode === 'en') start(enConv);
  else if (mode === 'cn') loadCC().then(() => { if (cc) start(cc); else { mode = 'tw'; mark(); } });
})();
</script>
</body>
</html>
